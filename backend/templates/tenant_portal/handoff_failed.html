{% extends "base.html" %}
{% block title %}Sign-in failed · MyPipelineHero{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 flex items-center justify-center">
  <div class="max-w-md w-full">
    <div class="bg-white shadow-sm rounded-lg p-8 text-center">
      <div class="mb-4">
        <svg class="w-12 h-12 text-red-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Sign-in failed</h1>
      <p class="text-gray-600 mb-6">
        We couldn't complete sign-in. This usually means the link expired
        or was already used. Please try signing in again.
      </p>
      <a href="{{ try_again_url }}"
   class="inline-block bg-gray-900 text-white px-4 py-2 rounded font-medium hover:bg-gray-800">
  Try again
</a>
    </div>
  </div>
</div>
{% endblock %}
