{% extends "platform_console/platform_base.html" %}

{% block platform_content %}
<div class="mph-pc-card mph-pc-card-narrow">
  <div class="mph-pc-page-header">
    <div>
      <h1 class="mph-pc-page-title">Entering tenant…</h1>
      <p class="mph-pc-page-subtitle">
        Connecting to <strong>{{ org_name }}</strong> at
        <span class="mph-pc-mono">{{ tenant_host }}</span> as the
        impersonating admin. If your browser does not redirect
        automatically, click the button below.
      </p>
    </div>
  </div>

  <form id="handoff-form" method="post" action="{{ post_url }}">
    <input type="hidden" name="token" value="{{ token }}">
    <button type="submit" class="mph-pc-btn mph-pc-btn-warning">
      Continue to {{ org_name }}
    </button>
  </form>

  <script>
    // Auto-submit. The cross-domain handoff consume endpoint is
    // csrf_exempt by design (B.4.12); we POST to the tenant
    // subdomain immediately so the JWT is exchanged for a tenant
    // session.
    document.getElementById('handoff-form').submit();
  </script>
</div>
{% endblock %}
